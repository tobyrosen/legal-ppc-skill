# Cowork Dependabot config — tailored for this repo.
# legal-ppc-skill is a docs/skill repo (markdown + JSON evals only) with no
# pip / npm / cargo manifests, so the multi-ecosystem template's pip/npm/cargo
# entries would abort each run with "no files found". The only ecosystem that
# applies here is the GitHub Actions workflow files.

version: 2
updates:
  # GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
